<!-- @dsCard group="Mobile App" viewport="1340x980" name="Proposed app screens" subtitle="A coherent screen architecture for Movie Night — Tonight · History · The Club · Settings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night — Proposed App Screens</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(70% 38% at 50% 0%, rgba(246,139,54,0.12), rgba(246,139,54,0) 55%),
      var(--night-950, #0C0A1B);
    font-family: var(--font-sans);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  button { -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 72px 40px 120px; }
  .lede { max-width: 720px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-strong); }
  .map { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .map-pill { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px 9px 12px; border-radius: 999px; background: var(--surface-card); border: 1px solid var(--border-hairline); font-size: 14px; color: var(--text-secondary); white-space: nowrap; }
  .map-pill b { color: var(--text-primary); font-weight: 600; }
  .map-pill i { width: 17px; height: 17px; color: var(--accent-strong); }
  .sec { margin-top: 72px; }
  .sec-head { border-top: 1px solid var(--border-hairline); padding-top: 22px; margin-bottom: 34px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 56px 48px; }
  .board { display: flex; flex-direction: column; gap: 18px; }
  .cap { max-width: 384px; padding-left: 4px; }
  .cap-n { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.06em; }
  .cap-t { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; color: var(--text-primary); margin-top: 4px; }
  .cap-d { font-size: 14px; line-height: 1.5; color: var(--text-secondary); margin-top: 7px; }
  .flow-tag { display: inline-block; margin-left: 9px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-strong); background: var(--surface-spotlight); border-radius: 4px; padding: 3px 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="stage"></div>

<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script src="./data.js"></script>
<script type="text/babel" src="./chrome.jsx"></script>
<script type="text/babel" src="./screens-core.jsx"></script>
<script type="text/babel" src="./screens-night.jsx"></script>
<script type="text/babel" src="./screens-shelf.jsx"></script>
<script type="text/babel" src="./screens-group.jsx"></script>
<script type="text/babel" src="./screens-setup.jsx"></script>
<script type="text/babel" src="./screens-scheduling.jsx"></script>

<script type="text/babel">
  const SECTIONS = [
    {
      eyebrow: "Entry",
      title: "Getting started",
      desc: "The first thing a new group sees — the product's one rule, stated up front, before any setup.",
      screens: [
        { comp: "WelcomeScreen", name: "Welcome", role: "First run. States the house rule, then “Start a group” or join with a code." },
      ],
    },
    {
      eyebrow: "Tab 1",
      title: "Tonight — the home",
      desc: "Answers the only question that matters at a glance: whose turn is it? The spotlight falls on the next picker; one tap starts the night.",
      screens: [
        { comp: "HomeScreen", name: "Tonight", role: "Home tab. The ember spotlight names who's up, with the on-deck order and the primary “Plan a night”." },
        { comp: "RotationScreen", name: "The order", role: "The full fairness-ranked rotation, with the why (fewest picks first) and a skip control." },
      ],
    },
    {
      eyebrow: "Flow",
      title: "Running the night",
      desc: "A focused flow launched from Tonight — when, who's here, what we're watching, locked in. It now opens with a date, so a night can be tonight or planned ahead. Replaces the old overloaded “Tonight” screen.",
      flow: true,
      screens: [
        { comp: "NightDateScreen", name: "When", role: "Step 1. Pick a date — tonight, a quick chip, or any day on the calendar. Dots mark nights already on the books." },
        { comp: "NightAttendanceScreen", name: "Who's here", role: "Step 2. Mark who's in; the next-up member attending gets the pick. Copy adapts for a future date (“Who's coming?”)." },
        { comp: "NightChooseScreen", name: "The pick", role: "Step 3. The picker searches and chooses the film — their call, no vote." },
        { comp: "NightRecordedScreen", name: "Recorded", role: "Step 4. Tonight's night is saved to history — movie, picker, and who watched." },
      ],
    },
    {
      eyebrow: "New",
      title: "Planning ahead",
      desc: "A night doesn't have to be tonight. Schedule one for any date: the picker is locked from the rotation now, the film is chosen on the night, and the home turns into a countdown so nobody forgets.",
      flow: true,
      screens: [
        { comp: "PlannedHomeScreen", name: "Tonight · planned", role: "Home once a night is on the calendar — an “Up next” card with the date, countdown, the picker, and who's coming." },
        { comp: "NightScheduledScreen", name: "Scheduled", role: "The future-night confirmation — the date, a countdown, the locked picker, and a nudge to remind the group." },
      ],
    },
    {
      eyebrow: "New",
      title: "Scheduling follow-ons",
      desc: "Once a night is on the calendar you can change it, put it on a cadence, and decide how the group gets nudged — plus what that nudge actually looks like.",
      flow: true,
      screens: [
        { comp: "EditNightScreen", name: "Edit night", role: "From the home's “Edit”. Change the date, recurrence, reminders and who's coming — or cancel the night." },
        { comp: "RepeatScreen", name: "Repeat", role: "Put movie night on a cadence (every week / 2 weeks / month), with a live preview of the next dates." },
        { comp: "RemindersScreen", name: "Reminders", role: "When to nudge (night before / morning of / 2h before) and who — the picker always gets a personal one." },
        { comp: "NotificationsScreen", name: "The nudge", role: "How a reminder lands — the picker's “it's your turn” push and the group heads-up on the lock screen." },
        { comp: "CalendarExportScreen", name: "Add to calendar", role: "A sheet over the Scheduled screen — pick which calendar, and (if it recurs) add the whole series or just this night." },
        { comp: "CalendarAddedScreen", name: "On the calendar", role: "Confirmation — added to the chosen calendar as a recurring event, with the next few dates and a jump to the OS calendar." },
      ],
    },
    {
      eyebrow: "Tab 2",
      title: "History — the shelf",
      desc: "The product's promise made visible — “remembers what you watched and who picked.” The biggest gap in the original three screens.",
      screens: [
        { comp: "HistoryScreen", name: "History", role: "History tab. Every night, newest first, grouped by month with posters and who picked." },
        { comp: "NightDetailScreen", name: "Night detail", role: "One night in full — the film, the picker spotlit, and everyone who was there." },
      ],
    },
    {
      eyebrow: "Tab 3",
      title: "The Club — the group",
      desc: "Members reframed around the rotation: who's in line, their pick counts, and a real profile per person. Folds in the old “Manage members”.",
      screens: [
        { comp: "MembersScreen", name: "The Club", role: "Members tab. In-rotation order, guests, and inactive — each with pick stats." },
        { comp: "MemberProfileScreen", name: "Member profile", role: "One member — their stats, place in line, and every film they've picked." },
        { comp: "AddMemberScreen", name: "Add member", role: "Add someone as core (enters rotation) or guest (watches only)." },
      ],
    },
    {
      eyebrow: "Tab 4",
      title: "Settings & rules",
      desc: "The group's controls and the house rule restated — skipping, who can pick, reminders.",
      screens: [
        { comp: "SettingsScreen", name: "Settings", role: "Settings tab. Group, rotation behavior, notifications, and the danger zone." },
      ],
    },
  ];

  function Board({ s, index }) {
    const Comp = window[s.comp];
    return (
      <div className="board">
        <Comp />
        <div className="cap">
          <div className="cap-n">{String(index).padStart(2, "0")}</div>
          <div className="cap-t">{s.name}</div>
          <div className="cap-d">{s.role}</div>
        </div>
      </div>
    );
  }

  function Page() {
    let n = 0;
    return (
      <div className="wrap">
        <div className="lede">
          <div className="eyebrow">Movie Night · Product design</div>
          <h1 style={{ fontFamily: "var(--font-display)", fontSize: 56, lineHeight: 1.04, letterSpacing: "-0.01em", margin: "16px 0 0", fontWeight: 400 }}>The screens the app should have</h1>
          <p style={{ fontSize: 17, lineHeight: 1.6, color: "var(--text-secondary)", marginTop: 18 }}>
            The current three screens each map to a feature, but never formed an app — and they skip the product's own promise to <em>remember what you watched</em>. This is a coherent architecture built on the ritual itself: <b style={{ color: "var(--text-primary)" }}>see whose turn → run the night → it's remembered → the rotation advances</b>. Four tabs hold it together.
          </p>
          <div className="map">
            <span className="map-pill"><i data-lucide="clapperboard"></i><b>Tonight</b> · whose turn + start</span>
            <span className="map-pill"><i data-lucide="history"></i><b>History</b> · the shelf</span>
            <span className="map-pill"><i data-lucide="users-round"></i><b>The Club</b> · members</span>
            <span className="map-pill"><i data-lucide="settings"></i><b>Settings</b> · rules</span>
          </div>
        </div>

        {SECTIONS.map((s) => (
          <div className="sec" key={s.title}>
            <div className="sec-head">
              <div className="eyebrow">{s.eyebrow}</div>
              <h2 style={{ fontFamily: "var(--font-display)", fontSize: 34, letterSpacing: "-0.01em", margin: "10px 0 0", fontWeight: 400 }}>
                {s.title}{s.flow && <span className="flow-tag">Flow</span>}
              </h2>
              <p style={{ fontSize: 15, lineHeight: 1.55, color: "var(--text-secondary)", margin: "10px 0 0", maxWidth: 620 }}>{s.desc}</p>
            </div>
            <div className="row">
              {s.screens.map((sc) => { n += 1; return <Board key={sc.comp} s={sc} index={n} />; })}
            </div>
          </div>
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("stage")).render(<Page />);
  const paint = () => window.lucide && window.lucide.createIcons();
  setTimeout(paint, 60);
  setTimeout(paint, 300);
  // re-apply glyphs after React re-renders triggered by taps on interactive screens
  document.addEventListener("click", () => setTimeout(paint, 0));
</script>
</body>
</html>
