name: Security

# "Is there a known vulnerability or leak?" — every scan that reports to the
# code-scanning Security tab lives here: per-component dependency audits,
# repo-wide secret scanning, and CodeQL. Build/lint/test lives in ci.yml.
#
# No path filter, so the checks always report (safe to require in main-ruleset).
# The weekly `schedule` re-runs every scan against an unchanged tree, so a CVE
# disclosed against an untouched dep (or a newer CodeQL query) still surfaces.
#
# SARIF pattern used by every scan job: one scan run both emits SARIF and gates
# (fails the job on findings); the upload steps run with `if: always()` so
# findings reach the Security tab even when the gate fails. Fork PRs get a
# read-only token and can't write security events, so uploads are skipped there
# (the gate still runs).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: backend-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools/gosec/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # gosec needs no install step: `just` runs it as a go tool from its own
      # module (backend/tools/gosec), so go.sum pins + verifies it.
      - name: Security audit (govulncheck + gosec)
        run: just audit-sarif

      - name: Upload govulncheck SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: backend/govulncheck.sarif
          category: govulncheck

      - name: Upload gosec SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: backend/gosec.sarif
          category: gosec

  mobile-audit:
    name: mobile-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Version + digest pinned in the Dockerfile (bumped by Dependabot).
      - name: Install osv-scanner (pinned image digest)
        run: |
          img=$(awk '/^FROM/ {print $2}' "$GITHUB_WORKSPACE/.github/tools/osv-scanner/Dockerfile")
          docker create --name osv-scanner "$img"
          docker cp osv-scanner:/osv-scanner ./osv-scanner
          docker rm osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner && rm osv-scanner
          osv-scanner --version

      - name: Dependency audit (osv-scanner)
        run: just audit-sarif

      - name: Upload osv-scanner SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: mobile/osv-scanner.sarif
          category: osv-scanner

  # Repo-wide: secrets are not component-scoped.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — required for a history-wide scan

      # Version + digest pinned in the Dockerfile (bumped by Dependabot).
      - name: Install betterleaks (pinned image digest)
        run: |
          img=$(awk '/^FROM/ {print $2}' .github/tools/betterleaks/Dockerfile)
          docker create --name betterleaks "$img"
          docker cp betterleaks:/usr/bin/betterleaks ./betterleaks
          docker rm betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks && rm betterleaks
          betterleaks version

      # betterleaks exits non-zero on a leak (no --exit-code override). Picks up
      # the repo-root .betterleaks.toml (the dev-credential filter).
      - name: Secret scan (full history)
        run: betterleaks git --no-banner --report-format sarif --report-path betterleaks.sarif

      - name: Upload betterleaks SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

  # CodeQL over both components (complementary to gosec's Go-idiom rules — both
  # are kept). Check names: `codeql (go)`, `codeql (javascript-typescript)`.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go module lives in backend/; install the toolchain for the manual build.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for Go: the module is in backend/, not the repo root, so
      # autobuild-from-root would fail. CodeQL traces this compile: the dev build
      # (-tags dev), so devreset.go is analysed too, as gosec and govulncheck do.
      - if: matrix.language == 'go'
        name: Build Go (traced by CodeQL)
        working-directory: backend
        run: go build -tags dev ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          category: "/language:${{ matrix.language }}"
