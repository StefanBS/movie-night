name: Security

# "Is there a known vulnerability or leak?" — every scan that reports to the
# code-scanning Security tab lives here: per-component dependency audits,
# repo-wide secret scanning, and CodeQL. Build/lint/test lives in ci.yml.
#
# No path filter, so the checks always report (safe to require in main-ruleset).
# The weekly `schedule` re-runs every scan against an unchanged tree, so a CVE
# disclosed against an untouched dep (or a newer CodeQL query) still surfaces.
#
# SARIF pattern used by every scan job: one scan run both emits SARIF and gates
# (fails the job on findings); the upload steps run with `if: always()` so
# findings reach the Security tab even when the gate fails. Fork PRs get a
# read-only token and can't write security events, so uploads are skipped there
# (the gate still runs).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: backend-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install gosec (pinned + checksum-verified)
        run: |
          curl -fsSL -o gosec.tar.gz "https://github.com/securego/gosec/releases/download/v2.26.1/gosec_2.26.1_linux_amd64.tar.gz"
          echo "665f48c10b10251ab70ef06635c8522900e6d25b0e6902931a697af2f7646360  gosec.tar.gz" | sha256sum -c -
          tar -xzf gosec.tar.gz gosec
          chmod +x gosec
          sudo mv gosec /usr/local/bin/

      - name: Security audit (govulncheck + gosec)
        run: just audit-sarif

      - name: Upload govulncheck SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: backend/govulncheck.sarif
          category: govulncheck

      - name: Upload gosec SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: backend/gosec.sarif
          category: gosec

  mobile-audit:
    name: mobile-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install osv-scanner (pinned + checksum-verified)
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: Dependency audit (osv-scanner)
        run: just audit-sarif

      - name: Upload osv-scanner SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: mobile/osv-scanner.sarif
          category: osv-scanner

  # Repo-wide: secrets are not component-scoped.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — required for a history-wide scan

      - name: Install betterleaks (pinned + checksum-verified)
        run: |
          curl -fsSL -o betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v1.3.1/betterleaks_1.3.1_linux_x64.tar.gz"
          echo "7b241c80204538cbb210c94514dc7cdff86430938bd7d5b6e289207959530849  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          chmod +x betterleaks
          sudo mv betterleaks /usr/local/bin/

      # betterleaks exits non-zero on a leak (no --exit-code override).
      - name: Secret scan (full history)
        run: betterleaks git --no-banner --report-format sarif --report-path betterleaks.sarif

      - name: Upload betterleaks SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

  # CodeQL over both components (complementary to gosec's Go-idiom rules — both
  # are kept). Check names: `codeql (go)`, `codeql (javascript-typescript)`.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go module lives in backend/; install the toolchain for the manual build.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for Go: the module is in backend/, not the repo root, so
      # autobuild-from-root would fail. CodeQL traces this compile.
      - if: matrix.language == 'go'
        name: Build Go (traced by CodeQL)
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          category: "/language:${{ matrix.language }}"
