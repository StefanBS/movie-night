<!-- @dsCard height=320 -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 320px; position: relative; overflow: hidden; background: var(--surface-page); }
  svg { position: absolute; left: 0; top: 0; }
  .accent { fill: var(--accent); }
  .sig2 { fill: var(--sig-2); }
  .sig1 { fill: var(--sig-1); }
  .sig3 { fill: var(--sig-3); }
  .ink { fill: var(--text-primary); }
  .hole { fill: var(--surface-page); }
  .poster { rx: var(--radius-sm); }
  .pill { rx: var(--radius-sm); }
  .text { position: absolute; left: 24px; bottom: 24px; max-width: 640px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 0.95; letter-spacing: -0.045em; color: var(--text-primary); }
  .tag { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.45; color: var(--text-secondary); }
</style>
</head><body>
<svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
  <!--
    blocks: accent 160×136, sig-2 (teal) 96×112, text-primary (ink) 240×136, sig-1 (gold) 96×104, sig-3 (lilac) 64×80, accent 112×128, sig-2 120×96 — poster slabs hung from the top edge, bottoms staggered on the 16px step.
    arrangement: top-band skeleton (the name is too wide for the 440px zone at 64px); slabs bleed off the top like posters on a shelf, gaps of space-4 (16px).
    pattern: a literal motif — film sprocket holes cut out of the ink slab, ground colour, chosen because "posters carry the colour" and the product is film nights.
    steps and radii: space-4 gaps, space-2 hole pitch offsets, radius-sm (4px) on every slab and hole; band 120px deep, a step clear of the name.
  -->
  <rect class="accent poster" x="24"  y="-16" width="160" height="136"/>
  <rect class="sig2 poster"   x="200" y="-16" width="96"  height="112"/>
  <rect class="ink poster"    x="312" y="-16" width="240" height="136"/>
  <rect class="sig1 poster"   x="568" y="-16" width="96"  height="104"/>
  <rect class="sig3 poster"   x="680" y="-16" width="64"  height="80"/>
  <rect class="accent poster" x="760" y="-16" width="112" height="128"/>
  <rect class="sig2 poster"   x="888" y="-16" width="120" height="96"/>
  <!-- sprocket holes cut from the ink slab -->
  <g class="hole">
    <rect class="pill" x="328" y="12"  width="16" height="12"/>
    <rect class="pill" x="328" y="40"  width="16" height="12"/>
    <rect class="pill" x="328" y="68"  width="16" height="12"/>
    <rect class="pill" x="328" y="96"  width="16" height="12"/>
    <rect class="pill" x="520" y="12"  width="16" height="12"/>
    <rect class="pill" x="520" y="40"  width="16" height="12"/>
    <rect class="pill" x="520" y="68"  width="16" height="12"/>
    <rect class="pill" x="520" y="96"  width="16" height="12"/>
  </g>
</svg>
<div class="text">
  <h1 class="name">Movie Night —<br>Design System</h1>
  <p class="tag">Every night, one person's pick is law.</p>
</div>
</body></html>
