<body><div id="root"></div>

<script src="../bundle.js"></script>

const Both = ({ children }) => <>{["dark", "light"].map(t => <div key={t} className="pane" data-theme={t}>{children(t)}</div>)}</>;

const coming = ["Tomas Vlk","Priya Nair","Jonah Reyes","Sam Lindqvist","Mira Okafor"];
function Demo(){return <Both>{t => t === "dark"
? <UpNextCard countdown="In 3 days" date="Fri 19 Jun" time="8 pm" picker="Tomas Vlk" coming={coming} />
: <UpNextCard countdown="Tonight" time="8 pm" picker="Priya Nair" film="In the Mood for Love" coming={coming} />}</Both>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
