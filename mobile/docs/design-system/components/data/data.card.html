<!-- @dsCard group="Components" viewport="900x640" name="Members, posters & stats" subtitle="Avatar (Film stock) · MemberRow · Poster · Stat · SectionLabel · SettingsRow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:#0A0908}#root{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.pane{padding:24px;background:var(--surface-page);color:var(--text-primary);display:flex;flex-direction:column;gap:18px}.cap{font-size:12px;font-weight:600;color:var(--text-tertiary)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex}.stack>*{margin-left:-5px}.stack>*:first-child{margin-left:0}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Avatar, MemberRow, Poster, Stat, SectionLabel, SettingsRow, Badge } = window.MovieNightDesignSystem_b54ad3;
const Chev = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
const names = ["Tomas Vlk","Priya Nair","Jonah Okafor","Sam Reyes","Mira Brandt","Ada Marsh","Leo Costa"]; // one per signature colour
const Pane = ({ t }) => (
  <div className="pane" data-theme={t}>
    <div className="cap">{t === "dark" ? "Dark" : "Light"}</div>
    <div className="row">{names.map((n, i) => <Avatar key={n} name={n} size={i === 0 ? "lg" : "md"} />)}</div>
    <div className="row"><div className="stack">{names.slice(0, 5).map(n => <Avatar key={n} name={n} size={28} style={{outline:"2px solid var(--surface-page)"}} />)}</div><span style={{fontSize:14,color:"var(--text-secondary)"}}>5 coming</span></div>
    <div>
      <MemberRow name="Tomas Vlk" meta="First turn" highlighted trailing={<Badge solid>Next up</Badge>} />
      <MemberRow name="Priya Nair" meta="2 picks · last May 22" />
      <MemberRow name="Jonah Okafor" compact trailing="2 picks · May 29" />
      <MemberRow name="Old Friend" meta="Inactive" muted divider={false} />
    </div>
    <div className="row" style={{alignItems:"flex-end",gap:14}}>
      <Poster title="Past Lives" year={2023} hue={20} w={70} h={105} />
      <Poster title="The Thing" year={1982} hue={200} w={70} h={105} />
      <div style={{display:"flex",gap:22,marginLeft:6}}><Stat value={6} label="Films" /><Stat value="2nd" label="In line" accent /></div>
    </div>
    <div><SectionLabel style={{marginTop:0}}>Reminders</SectionLabel>
      <div style={{background:"var(--surface-card)",borderRadius:"var(--radius-lg)"}}>
        <SettingsRow label="Default start time" value="8:00 pm" right={<Chev />} divider />
        <SettingsRow label="Leave club" danger />
      </div>
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById("root")).render(<><Pane t="dark" /><Pane t="light" /></>);
</script></body></html>
