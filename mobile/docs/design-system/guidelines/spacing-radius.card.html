<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary)}.lab{font-size:12px;font-weight:600;color:var(--text-secondary)}.hex{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}.wrap{padding:24px 28px;display:flex;gap:24px;align-items:flex-end}.col{display:flex;flex-direction:column;align-items:center;gap:8px}.box{width:72px;height:60px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-strong)}</style></head><body><div class="wrap"><div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 4</div><div class="hex">posters</div></div><div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · 12</div><div class="hex">inputs, toasts</div></div><div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 18</div><div class="hex">cards</div></div><div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 28</div><div class="hex">hero cards</div></div><div class="col"><div class="box" style="border-radius:var(--radius-full);width:110px;height:44px"></div><div class="lab">full · 999</div><div class="hex">buttons, badges</div></div></div></body></html>
