<!-- @dsCard group="Colors" viewport="760x330" name="Semantic colours, both themes" subtitle="Same token names; values swap with data-theme" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary)}.lab{font-size:12px;font-weight:600;color:var(--text-secondary)}.hex{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;min-height:100vh"><div data-theme="dark" style="flex:1;background:var(--surface-page);color:var(--text-primary);padding:20px;display:flex;flex-direction:column;gap:10px"><div class="lab">Dark (default)</div>
<div style="background:var(--surface-card);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:800;font-size:26px;letter-spacing:-.03em">Tomas</div><div style="font-family:var(--font-serif);font-style:italic;font-size:18px">picks the film.</div><div style="font-size:14px;color:var(--text-secondary)">--text-secondary on --surface-card</div><div style="font-size:13px;color:var(--text-tertiary)">--text-tertiary</div>
<div style="display:flex;gap:8px;margin-top:6px"><span style="background:var(--accent);color:var(--text-on-accent);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px">--accent</span><span style="color:var(--accent-strong);font-weight:700;font-size:14px;padding:9px 0">--accent-strong</span></div></div>
<div style="display:flex;gap:6px"><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">page</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">card</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-subtle);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">subtle</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">raised</div></div></div></div><div data-theme="light" style="flex:1;background:var(--surface-page);color:var(--text-primary);padding:20px;display:flex;flex-direction:column;gap:10px"><div class="lab">Light · data-theme="light"</div>
<div style="background:var(--surface-card);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:800;font-size:26px;letter-spacing:-.03em">Tomas</div><div style="font-family:var(--font-serif);font-style:italic;font-size:18px">picks the film.</div><div style="font-size:14px;color:var(--text-secondary)">--text-secondary on --surface-card</div><div style="font-size:13px;color:var(--text-tertiary)">--text-tertiary</div>
<div style="display:flex;gap:8px;margin-top:6px"><span style="background:var(--accent);color:var(--text-on-accent);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px">--accent</span><span style="color:var(--accent-strong);font-weight:700;font-size:14px;padding:9px 0">--accent-strong</span></div></div>
<div style="display:flex;gap:6px"><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">page</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">card</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-subtle);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">subtle</div></div><div style="flex:1"><div style="height:28px;border-radius:6px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div class="hex" style="margin-top:4px">raised</div></div></div></div></div></body></html>
