00)"></div><div class="lab">500</div><div class="hex">#7A7369</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="lab">300</div><div class="hex">#B5AEA3</div></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="lab">200</div><div class="hex">#D6D0C6</div></div><div class="sw"><div class="chip" style="background:var(--ink-150)"></div><div class="lab">150</div><div class="hex">#E4DFD6</div></div><div class="sw"><div class="chip" style="background:var(--ink-50)"></div><div class="lab">50</div><div class="hex">#F4F1EC</div></div><div class="sw"><div class="chip" style="background:var(--ink-0)"></div><div class="lab">0</div><div class="hex">#FFFFFF</div></div></div></div></body></html>
