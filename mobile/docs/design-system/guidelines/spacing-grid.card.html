<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing grid" subtitle="4px base — 4 / 8 / 12 / 16 / 20 / 24 / 32" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--text-primary); background: var(--surface-page); }
  .wrap { padding: var(--space-5) var(--space-6); display: flex; gap: var(--space-5); align-items: flex-end; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent); border-radius: var(--radius-sm); width: 100%; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .lab { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="lab" style="margin-top:8px">4</div></div>
    <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="lab" style="margin-top:8px">8</div></div>
    <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="lab" style="margin-top:8px">12</div></div>
    <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="lab" style="margin-top:8px">16</div></div>
    <div class="col"><div class="bar" style="width:20px;height:20px"></div><div class="lab" style="margin-top:8px">20</div></div>
    <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="lab" style="margin-top:8px">24</div></div>
    <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="lab" style="margin-top:8px">32</div></div>
  </div>
</body>
</html>
