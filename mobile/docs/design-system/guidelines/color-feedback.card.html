<!-- @dsCard group="Colors" viewport="760x170" name="Feedback" subtitle="Red only when something is about to be destroyed" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary)}.lab{font-size:12px;font-weight:600;color:var(--text-secondary)}.hex{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;min-height:100vh"><div data-theme="dark" style="flex:1;background:var(--surface-page);padding:20px;display:flex;flex-direction:column;gap:10px"><div class="lab">dark</div><div style="background:var(--surface-danger);color:var(--text-danger);border-radius:12px;padding:12px 14px;font-size:14px"><b style="color:var(--danger)">Danger — destructive only</b></div><div style="background:var(--surface-success);color:var(--text-primary);border-radius:12px;padding:12px 14px;font-size:14px"><b style="color:var(--success)">Success — rare</b></div></div><div data-theme="light" style="flex:1;background:var(--surface-page);padding:20px;display:flex;flex-direction:column;gap:10px"><div class="lab">light</div><div style="background:var(--surface-danger);color:var(--text-danger);border-radius:12px;padding:12px 14px;font-size:14px"><b style="color:var(--danger)">Danger — destructive only</b></div><div style="background:var(--surface-success);color:var(--text-primary);border-radius:12px;padding:12px 14px;font-size:14px"><b style="color:var(--success)">Success — rare</b></div></div></div></body></html>
