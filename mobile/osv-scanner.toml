# osv-scanner ignore list. Entries self-expire: once `ignoreUntil` passes, the
# vuln re-surfaces and CI fails again, forcing a re-review. osv-scanner also
# reports an ignore as "unused" once the upstream fix lands, signalling it can be
# deleted. Re-review both when bumping the Expo SDK. Prefer a same-major `overrides` pin in
# package.json; ignore only what has no compatible fix.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31T00:00:00Z
# deepmerge@4.3.1 — expo > @expo/config and react-native-svg-transformer >
# @svgr/plugin-svgo. Both run at build time (reading app.json, transforming
# SVGs in Metro); neither is in the app bundle (checked with `expo export`).
# Prototype poisoning in mergeObject(); 4.3.1 is the latest release, no fix.
reason = "build-time dep of @expo/config and svgr; no fixed deepmerge release"

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
