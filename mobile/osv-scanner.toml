# osv-scanner ignore list. Entries self-expire: once `ignoreUntil` passes, the
# vuln re-surfaces and CI fails again, forcing a re-review. osv-scanner also
# reports an ignore as "unused" once the upstream fix lands, signalling it can be
# deleted. Re-review both when bumping the Expo SDK. Prefer a same-major `overrides` pin in
# package.json; ignore only what has no compatible fix.

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2027-01-31T00:00:00Z
# decode-uri-component@0.2.2 — expo-router > query-string@7. Runtime-reachable
# (route/query parsing), but impact is a hang on malformed percent-encoding in a
# URL handed to our own app. Fix is 0.5.0, which is ESM-only: query-string@7
# `require()`s it as a function, so an override breaks routing. Still present on
# expo-router 58. Mitigated on native: app/+native-intent.tsx drops incoming
# links with malformed percent-encoding or over 2KB (lib/deepLink.ts).
reason = "fix (0.5.0) is ESM-only and breaks query-string@7; native deep links guarded by lib/deepLink.ts"

