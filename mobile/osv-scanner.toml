# osv-scanner ignore list. Entries self-expire: once `ignoreUntil` passes, the
# vuln re-surfaces and CI fails again, forcing a re-review. osv-scanner also
# reports an ignore as "unused" once the upstream fix lands, signalling it can be
# deleted. Re-review both when bumping the Expo SDK. Prefer a same-major `overrides` pin in
# package.json; ignore only what has no compatible fix.

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31T00:00:00Z
# zod@3.25.76 — expo > @expo/cli. Dev CLI only (validates local config); not in
# the app bundle. Fixed only in zod 4.6.6, and @expo/cli (57 and 58) needs zod 3.
# The zod@4 copy under eslint-plugin-react-hooks already resolves to a fixed 4.x.
reason = "@expo/cli dev-time dep on zod 3; no zod 3 fix exists"
