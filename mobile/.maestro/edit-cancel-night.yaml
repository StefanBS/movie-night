# From plan-night's Night (backend/fixtures/tonight-planned.sql: Ada and
# Blake, Dune), edit who's coming, then cancel it.
appId: ${APP_ID}
name: Edit, then cancel, a night
---
- runFlow:
    file: common/setup.yaml
    env:
      FIXTURE: tonight-planned
- assertVisible: Dune
- assertVisible: 2 coming
- tapOn: Edit
- tapOn: Cleo
- tapOn: Save changes
- assertVisible: Dune
- assertVisible: 3 coming
- tapOn: Edit
- tapOn: Cancel this night
# No night planned any more: Tonight is back to Ada's empty turn.
- assertVisible: Plan a night
