# Record tonight's night as watched, then find it on the Watched tab. It
# starts from plan-night's Night (backend/fixtures/tonight-planned.sql).
appId: ${APP_ID}
name: Mark a night watched
tags: [nights]
---
- runFlow:
    file: common/setup.yaml
    env:
      FIXTURE: tonight-planned
- tapOn: We watched it
- tapOn: "Record: Ada picked.*"
- tapOn: Done
- tapOn: Watched
- assertVisible: Dune
