# Plan a night for a later date (the first day of next month, so it works
# whatever day it runs) with Ada and Blake and no film yet, then check Tonight
# shows it up next with its countdown and date.
appId: ${APP_ID}
name: Plan a night for a later date
tags: [nights]
---
- runFlow: common/setup.yaml
- runScript: common/first-of-next-month.js
- tapOn: Plan a night
- tapOn: Next month
# The Calendar, who step and Up next card carry testIDs by date; their labels
# are lib/date.ts's, checked by its unit tests (#303).
- assertVisible:
    id: month-${output.later.month}
- tapOn:
    id: day-${output.later.iso}
- tapOn: "Next: who's coming.*"
- assertVisible:
    id: who-date-${output.later.iso}
- tapOn: Ada
- tapOn: Blake
- tapOn: "Next: Ada picks.*"
- tapOn: "Skip for now.*"
- tapOn: Done
- assertVisible:
    id: up-next-when-${output.later.iso}
    text: "(Tomorrow|In \\d+ days) · .+"
- assertVisible: Not picked yet.
- assertVisible: Choose the film
- assertVisible: 2 coming
