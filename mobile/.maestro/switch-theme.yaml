# Pin the theme to Light, then Dark, with the Theme row in Settings ›
# Appearance, relaunch and check the choice came back from storage, then set
# it back to System so the next flow runs with the phone's own mode.
appId: ${APP_ID}
name: Switch the theme
tags: [settings, smoke]
---
- runFlow: common/setup.yaml
- tapOn: Settings
- scrollUntilVisible:
    element: Dark
- assertVisible:
    text: System
    checked: true
- tapOn: Light
- assertVisible:
    text: Light
    checked: true
- assertVisible:
    text: System
    checked: false
- takeScreenshot: theme-light
- tapOn: Dark
- assertVisible:
    text: Dark
    checked: true
- takeScreenshot: theme-dark
- runFlow: common/relaunch.yaml
- tapOn: Settings
- scrollUntilVisible:
    element: Dark
- assertVisible:
    text: Dark
    checked: true
- tapOn: System
- assertVisible:
    text: System
    checked: true
