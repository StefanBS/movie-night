# Record tonight's night, then change its film from the receipt's "Change
# film": the Night reads as a record and Watched shows the new film, not the
# old one.
# Movie search hits the real TMDB: match the exact title under the result
# count, not a list position.
appId: ${APP_ID}
name: Change a recorded night's film
---
- runFlow: plan-night.yaml
- tapOn: We watched it
- tapOn: "Record: Ada picked.*"
- assertVisible: Recorded ✓
- tapOn: Change film
- assertVisible: 'What are we watching\?'
- tapOn: Search a film title…
- inputText: The Holdovers
- pressKey: Enter
- tapOn:
    text: The Holdovers
    below: '\d+ films? · tap one.*'
- assertVisible: The Holdovers
# A night recorded tonight reads as a record, not a plan.
- assertVisible: Who watched · 2
- tapOn: Back to Tonight
- tapOn: Watched
- assertVisible: The Holdovers
# Exact match: the seeded "Dune: Part Two" stays.
- assertNotVisible: Dune
