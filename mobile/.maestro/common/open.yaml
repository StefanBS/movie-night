# Opens the dev client on "Who are you?", unclaimed, for a flow that claims
# someone other than Ada or joins as a guest (every other flow runs setup.yaml).
# The reseed (launch.yaml) empties `devices`, which revokes the phone's
# identity token, so the app opens unclaimed without clearing its state.
# A flow can pass FIXTURE (backend/fixtures/) to start from more than the seed.
appId: ${APP_ID}
---
- runFlow:
    file: launch.yaml
    env:
      FIXTURE: "${typeof FIXTURE === 'undefined' ? '' : FIXTURE}"
      CLAIMED: "0"
- extendedWaitUntil:
    visible: 'Who are you\?'
    timeout: 90000
