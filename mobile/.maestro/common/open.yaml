# Opens the dev client against Metro on "Who are you?", unclaimed. setup.yaml
# runs this and then claims Ada; a flow that claims someone else (or joins as a
# guest) runs this directly.
# `just e2e` passes APP_ID (from app.json) and DEV_LINK
# (`just phone devlink --no-fab`) and reseeds the DB before each flow. Reseeding empties `devices`, which
# revokes the phone's identity token, so the app opens on "Who are you?"
# without clearing its state. Don't use clearState: it also wipes granted
# permissions and the dev menu's onboarding flag, so every run stops on system
# and dev-client dialogs.
# Notifications are granted up front: claiming asks for them (pushDevice.ts),
# and the OS prompt would block a fresh install.
appId: ${APP_ID}
---
- stopApp
- setPermissions:
    permissions:
      notifications: allow
- openLink: ${DEV_LINK}
- extendedWaitUntil:
    visible: 'Who are you\?'
    timeout: 90000
