# Every flow runs this first (unless it needs an unclaimed phone; see
# open.yaml): the dev client opened on "Who are you?", then claimed as Ada (she
# has never picked in the seed, so she's next up).
appId: ${APP_ID}
---
- runFlow: open.yaml
- tapOn: Ada
- extendedWaitUntil:
    visible: Plan a night
    timeout: 15000
